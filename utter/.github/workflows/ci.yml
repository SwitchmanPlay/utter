name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (pure-python test deps only)
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest ruff
      - name: Lint
        run: ruff check src tests
      - name: Unit tests (no Qt / no models needed)
        run: python -m pytest -q tests

  smoke-import:
    # Full dependency install + import of every module (catches broken Qt/sherpa imports)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import all modules (offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: python -c "import utter.app, utter.ui.main_window, utter.ui.settings_dialog, utter.tts.speaker, utter.tts.engine; print('ok')"
