[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "utter"
version = "3.0.1"
description = "Select it. Hear it. Any text on your screen, spoken aloud by local neural voices. 100% offline."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Danylo Prokhorenko" }]
keywords = ["tts", "text-to-speech", "kokoro", "supertonic", "piper", "offline", "local", "accessibility"]
classifiers = [
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "PySide6>=6.6",
  "sherpa-onnx>=1.12",
  "sounddevice>=0.4.6",
  "numpy>=1.24",
  "pynput>=1.7.6",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6.3", "ruff"]

[project.scripts]
utter = "utter.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
